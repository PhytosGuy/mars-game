<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NASA Mission Design Lab | Mars: Last Colony</title>
<meta name="description" content="Design a science mission the NASA way: pick a goal, build your spacecraft in 3D, choose a rocket, catch the launch window and launch. Part of Mars: Last Colony.">
<meta name="theme-color" content="#110d0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%23d9622b'/%3E%3Ccircle cx='24' cy='26' r='5' fill='%23a8441b'/%3E%3Ccircle cx='40' cy='40' r='7' fill='%23a8441b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/missionlab/lab.css?v=1.2.0">
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<header class="top">
  <a class="back" id="back" href="/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back to the game</a>
  <h1><span class="planet" aria-hidden="true"></span>NASA Mission Design Lab</h1>
  <button class="btn" id="mybtn">My missions <span class="count" id="mycount">0</span></button>
</header>

<main id="lab">
  <section class="panel">
    <div id="mlsteps" class="mlsteps"></div>
    <div id="mlbody" class="mlbody"></div>
    <div class="mlnav"><button class="btn" id="ml-back">Back</button><span></span><button class="btn primary" id="ml-next">Next</button></div>
  </section>
  <aside class="stage" id="stage">
    <canvas id="v3d" aria-label="3D model of your current choice"></canvas>
    <div id="mlviz" class="hidden"></div>
    <div class="cap" id="vcap"></div>
    <div class="hint">Drag to turn · scroll to zoom</div>
    <div class="nogl-msg">3D needs WebGL, which this browser has turned off.</div>
  </aside>
</main>

<div id="mym" class="overlay hidden"><div class="win"><div class="winhead"><h2>My missions</h2><button class="x" id="mym-x" aria-label="Close">✕</button></div><p class="sub">Saved in this browser. Each launched mission also earns research points for your colony in the game.</p><div id="mymbody"></div></div></div>
<div id="toast" role="status"></div>

<script type="module">
import * as THREE from 'three';
window.THREE = THREE;
const V = '1.2.0';
const load = src => new Promise((ok, bad) => { const s = document.createElement('script'); s.src = src + '?v=' + V; s.onload = ok; s.onerror = () => bad(new Error('Could not load ' + src)); document.body.appendChild(s) });
try { await load('/missionlab/models.js'); await load('/missionlab/lab.js') }
catch (e) { document.getElementById('mlbody').innerHTML = '<p>The Mission Lab could not load. Check your connection and refresh the page.</p>'; console.error(e) }
</script>
</body>
</html>
